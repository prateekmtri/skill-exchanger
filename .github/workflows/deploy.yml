name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Backend Image
      run: |
        docker build -t skill-exchanger-backend ./backend

    - name: Build Frontend Image
      # Yahan hum Build-time environment variables pass kar rahe hain
      # Taaki Next.js build ke waqt variables ki wajah se crash na ho
      run: |
        docker build -t skill-exchanger-frontend ./frontend \
          --build-arg GROQ_API_KEY="dummy_key_for_ci" \
          --build-arg NEXT_PUBLIC_API_BASE_URL="http://localhost:5000"
      env:
        # Kuch cases mein env flag bhi zaroori hota hai
        GROQ_API_KEY: "dummy_key_for_ci"
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:5000"

    - name: Run Success Message
      run: |
        echo "Docker images for both Frontend and Backend built successfully!"
name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Backend Image
      run: |
        docker build -t skill-exchanger-backend ./backend

    - name: Build Frontend Image
      # Build-time par dummy variables pass kar rahe hain taaki Next.js build crash na ho
      run: |
        docker build \
          --build-arg GROQ_API_KEY="dummy_key_for_ci" \
          --build-arg NEXT_PUBLIC_API_BASE_URL="https://skill-exchanger.onrender.com" \
          -t skill-exchanger-frontend ./frontend
      env:
        GROQ_API_KEY: "dummy_key_for_ci"
        NEXT_PUBLIC_API_BASE_URL: "https://skill-exchanger.onrender.com"

    - name: Run Success Message
      run: |
        echo "✅ CI Build Successful! Both Docker images are valid."